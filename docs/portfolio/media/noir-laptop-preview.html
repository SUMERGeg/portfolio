<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>NOIR — рабочий мокап ноутбука</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #070b11;
      }
      .scene { position: relative; width: min(80vw, 1120px); padding: 64px 20px 120px; }
      .scene::before {
        content: "";
        position: absolute;
        inset: 15% -8% 2%;
        background: radial-gradient(ellipse, rgb(43 93 182 / 36%), transparent 66%);
      }
      .laptop {
        position: relative;
        transform: perspective(1800px) rotateY(-13deg) rotateX(4deg) rotateZ(-2deg);
        transform-style: preserve-3d;
        margin-inline: auto;
        width: 88%;
      }
      .screen {
        padding: 24px 14px 22px;
        position: relative;
        border: 2px solid #66717c;
        border-radius: 24px 24px 10px 10px;
        background: linear-gradient(145deg, #1d2329, #040506 24%, #0b1016);
        box-shadow: 0 8px 28px rgb(0 0 0 / 55%), 1px 0 0 #d6dce1 inset;
      }
      .screen::before {
        content: "";
        position: absolute;
        top: 9px;
        left: calc(50% - 3px);
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #19232b;
      }
      .screen img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 3px;
        aspect-ratio: 1425 / 891;
      }
      .base {
        position: absolute;
        top: calc(100% - 1px);
        left: -12%;
        width: 124%;
        height: 84px;
        background: linear-gradient(165deg, #788492, #a1aab4 38%, #576474 78%, #252e38);
        clip-path: polygon(9.5% 0, 90.5% 0, 100% 83%, 98.5% 96%, 3% 100%, 0 88%);
        box-shadow: 0 20px 36px #000;
      }
      .keyboard {
        position: absolute;
        inset: 7px 18% 34px;
        border: 3px solid #303944;
        background: repeating-linear-gradient(90deg, #101820 0 14px, #43505d 14px 16px);
        transform: skewX(-10deg);
        border-radius: 4px;
      }
      .trackpad {
        position: absolute;
        bottom: 11px;
        left: 40%;
        width: 24%;
        height: 21px;
        border: 1px solid #526173;
        border-radius: 4px;
        background: rgb(175 187 200 / 20%);
      }
      .shadow {
        position: absolute;
        inset: auto -4% -111px;
        height: 52px;
        background: radial-gradient(ellipse, rgb(0 0 0 / 90%), transparent 68%);
        transform: rotateZ(2deg);
      }
      @media (max-width: 600px) {
        .scene { width: 94vw; padding: 32px 0 90px; }
        .screen { padding: 17px 7px 12px; border-radius: 12px 12px 5px 5px; }
        .base { height: 40px; }
        .keyboard { inset: 4px 18% 17px; border-width: 1px; }
        .trackpad { bottom: 4px; height: 10px; }
      }
    </style>
  </head>
  <body>
    <main class="scene" aria-label="Рабочий мокап ноутбука с настоящим экраном NOIR">
      <div class="laptop">
        <div class="shadow" aria-hidden="true"></div>
        <div class="screen">
          <img src="../../../src/assets/projects/noir/home-desktop.jpg" alt="Главная концептуального сайта NOIR Detailing" />
        </div>
        <div class="base" aria-hidden="true"><div class="keyboard"></div><div class="trackpad"></div></div>
      </div>
    </main>
  </body>
</html>
